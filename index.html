<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control PLANILLA AFE</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; }
    body { background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 16px; }
    .contenedor { background: #1e293b; width: 100%; max-width: 480px; padding: 20px; border-radius: 14px; box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35); }
    h1 { font-size: 1.2rem; text-align: center; margin-bottom: 14px; color: #38bdf8; }
    .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 18px; }
    .tab-btn { padding: 10px; border: 1px solid #334155; background: #0f172a; color: #94a3b8; border-radius: 8px; font-weight: 600; font-size: 0.9rem; cursor: pointer; transition: 0.2s; }
    .tab-btn.activo { background: #0284c7; color: #ffffff; border-color: #0284c7; }
    .formulario { display: none; }
    .formulario.activo { display: block; }
    .campo { margin-bottom: 12px; }
    .fila-doble { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .label-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    label { font-size: 0.8rem; color: #cbd5e1; }
    .btn-hora { background: #334155; color: #38bdf8; border: none; border-radius: 5px; padding: 2px 7px; font-size: 0.72rem; font-weight: 600; cursor: pointer; }
    .btn-hora:hover { background: #475569; }
    input { width: 100%; padding: 10px; border: 1px solid #334155; background: #0f172a; color: #ffffff; border-radius: 8px; font-size: 0.95rem; color-scheme: dark; }
    input:focus { outline: none; border-color: #38bdf8; }
    .grupo-titulo { font-size: 0.85rem; color: #38bdf8; font-weight: 700; margin: 14px 0 8px; border-bottom: 1px solid #334155; padding-bottom: 4px; }
    .btn-enviar { width: 100%; padding: 12px; background: #16a34a; color: #ffffff; border: none; border-radius: 8px; font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 6px; transition: 0.2s; }
    .btn-enviar:hover { background: #15803d; }
    .btn-enviar:disabled { background: #475569; cursor: not-allowed; }
    #estado { margin-top: 10px; text-align: center; font-size: 0.9rem; min-height: 20px; }
    .ok { color: #4ade80; font-weight: 600; }
    .err { color: #f87171; font-weight: 600; }
    .vista-previa { margin-top: 18px; padding-top: 14px; border-top: 1px solid #334155; }
    .vista-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .vista-titulo { font-size: 0.85rem; font-weight: 700; color: #38bdf8; }
    .btn-refrescar { background: #334155; color: #f8fafc; border: none; border-radius: 6px; padding: 4px 10px; font-size: 0.78rem; font-weight: 600; cursor: pointer; }
    .btn-refrescar:hover { background: #475569; }
    .tabla-wrap { overflow-x: auto; border: 1px solid #334155; border-radius: 8px; background: #0f172a; }
    table { width: 100%; border-collapse: collapse; font-size: 0.76rem; }
    th, td { padding: 7px 8px; text-align: left; border-bottom: 1px solid #1e293b; white-space: nowrap; }
    th { background: #172554; color: #bae6fd; font-weight: 700; }
    tr:last-child td { border-bottom: none; }
    .vacio { text-align: center; color: #94a3b8; padding: 12px; }
  </style>
</head>
<body>

<div class="contenedor">
  <h1>Registro PLANILLA AFE</h1>

  <div class="tabs">
    <button type="button" class="tab-btn activo" onclick="cambiarTab('ENTRADA', this)">Ingresos / Salidas</button>
    <button type="button" class="tab-btn" onclick="cambiarTab('GUARDIA', this)">Guardias</button>
  </div>

  <form id="formENTRADA" class="formulario activo" onsubmit="enviarDatos(event, this)">
    <input type="hidden" name="hoja" value="ENTRADA">

    <div class="campo">
      <div class="label-row">
        <label for="fechaEntrada">Fecha (DD/MM/AA)</label>
      </div>
      <input type="text" id="fechaEntrada" name="fecha" placeholder="Ej. 19/11/26" required>
    </div>

    <div class="fila-doble">
      <div class="campo">
        <div class="label-row">
          <label for="hrEntrada">Hr Entrada</label>
          <button type="button" class="btn-hora" onclick="ponerHoraActual('hrEntrada')">Ahora</button>
        </div>
        <input type="time" id="hrEntrada" name="hrEntrada" required>
      </div>
      <div class="campo">
        <div class="label-row">
          <label for="hrSalida">Hr Salida</label>
          <button type="button" class="btn-hora" onclick="ponerHoraActual('hrSalida')">Ahora</button>
        </div>
        <input type="time" id="hrSalida" name="hrSalida">
      </div>
    </div>

    <div class="campo">
      <div class="label-row">
        <label for="nombreEntrada">Nombre / Empresa</label>
      </div>
      <input type="text" id="nombreEntrada" name="nombre" placeholder="Ej. Juan Pérez o Republicana" required>
    </div>

    <div class="campo">
      <div class="label-row">
        <label for="cedulaEntrada">Cédula</label>
      </div>
      <input type="text" id="cedulaEntrada" name="cedula" placeholder="Ej. 45123456">
    </div>

    <div class="campo">
      <div class="label-row">
        <label for="obsEntrada">Observaciones / Matrícula</label>
      </div>
      <input type="text" id="obsEntrada" name="observaciones" placeholder="Ej. GESTAM / SCN 1503">
    </div>

    <button type="submit" class="btn-enviar">Guardar en ENTRADA</button>
  </form>

  <form id="formGUARDIA" class="formulario" onsubmit="enviarDatos(event, this)">
    <input type="hidden" name="hoja" value="GUARDIA">

    <div class="campo">
      <div class="label-row">
        <label for="diaGuardia">Día o Puesto (Columna B)</label>
      </div>
      <input type="text" id="diaGuardia" name="dia" placeholder="Ej. 19/11/2026 o AFE 2" required>
    </div>

    <div class="grupo-titulo">AFE 2 — Entrada</div>
    <div class="fila-doble">
      <div class="campo">
        <div class="label-row">
          <label for="nombreAfe2">Nombre Guardia</label>
        </div>
        <input type="text" id="nombreAfe2" name="nombreAfe2" placeholder="Nombre">
      </div>
      <div class="campo">
        <div class="label-row">
          <label for="entradaAfe2">Hora Entrada</label>
          <button type="button" class="btn-hora" onclick="ponerHoraActual('entradaAfe2')">Ahora</button>
        </div>
        <input type="time" id="entradaAfe2" name="entradaAfe2">
      </div>
    </div>

    <div class="grupo-titulo">AFE OF — Salida</div>
    <div class="fila-doble">
      <div class="campo">
        <div class="label-row">
          <label for="nombreAfeOf">Nombre Guardia</label>
        </div>
        <input type="text" id="nombreAfeOf" name="nombreAfeOf" placeholder="Nombre">
      </div>
      <div class="campo">
        <div class="label-row">
          <label for="salidaAfeOf">Hora Salida</label>
          <button type="button" class="btn-hora" onclick="ponerHoraActual('salidaAfeOf')">Ahora</button>
        </div>
        <input type="time" id="salidaAfeOf" name="salidaAfeOf">
      </div>
    </div>

    <button type="submit" class="btn-enviar">Guardar en GUARDIA</button>
  </form>

  <p id="estado"></p>

  <div class="vista-previa">
    <div class="vista-header">
      <span class="vista-titulo" id="tituloVista">Últimos cargados en ENTRADA</span>
      <button type="button" class="btn-refrescar" onclick="cargarUltimos(hojaActual)">Actualizar</button>
    </div>
    <div class="tabla-wrap">
      <table>
        <thead id="tablaHead"></thead>
        <tbody id="tablaBody">
          <tr><td class="vacio" colspan="5">Cargando registros...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
  const SCRIPT_URL = 'PEGA_AQUI_TU_URL_DE_APPS_SCRIPT';
  const estado = document.getElementById('estado');
  let hojaActual = 'ENTRADA';

  function obtenerFechasHoy() {
    const hoy = new Date();
    const dd = String(hoy.getDate()).padStart(2, '0');
    const mm = String(hoy.getMonth() + 1).padStart(2, '0');
    const aa = String(hoy.getFullYear()).slice(-2);
    const aaaa = hoy.getFullYear();
    return {
      corta: `${dd}/${mm}/${aa}`,
      larga: `${dd}/${mm}/${aaaa}`
    };
  }

  function obtenerHoraActual() {
    const ahora = new Date();
    const hh = String(ahora.getHours()).padStart(2, '0');
    const min = String(ahora.getMinutes()).padStart(2, '0');
    return `${hh}:${min}`;
  }

  function ponerHoraActual(inputId) {
    document.getElementById(inputId).value = obtenerHoraActual();
  }

  function rellenarFechas() {
    const fechas = obtenerFechasHoy();
    document.getElementById('fechaEntrada').value = fechas.corta;
    document.getElementById('diaGuardia').value = fechas.larga;
  }

  function renderEncabezados(hoja) {
    const thead = document.getElementById('tablaHead');
    if (hoja === 'ENTRADA') {
      thead.innerHTML = '<tr><th>Fecha</th><th>Entrada</th><th>Salida</th><th>Nombre</th><th>Obs.</th></tr>';
    } else {
      thead.innerHTML = '<tr><th>Día/Puesto</th><th>AFE 2</th><th>Ent.</th><th>AFE OF</th><th>Sal.</th></tr>';
    }
  }

  async function cargarUltimos(hoja) {
    const tbody = document.getElementById('tablaBody');
    document.getElementById('tituloVista').textContent = `Últimos cargados en ${hoja}`;
    renderEncabezados(hoja);
    tbody.innerHTML = '<tr><td class="vacio" colspan="5">Actualizando...</td></tr>';

    if (!SCRIPT_URL || SCRIPT_URL.includes('PEGA_AQUI')) {
      tbody.innerHTML = '<tr><td class="vacio" colspan="5">Pega tu URL de Apps Script en el código.</td></tr>';
      return;
    }

    try {
      const resp = await fetch(`${SCRIPT_URL}?hoja=${encodeURIComponent(hoja)}&limite=8`);
      const data = await resp.json();
      const rows = Array.isArray(data.rows) ? data.rows : [];

      const filasLimpias = rows.filter(r => r.some(celda => String(celda).trim() !== ''));
      if (filasLimpias.length === 0) {
        tbody.innerHTML = '<tr><td class="vacio" colspan="5">Sin registros recientes.</td></tr>';
        return;
      }

      tbody.innerHTML = filasLimpias.map(r => {
        if (hoja === 'ENTRADA') {
          return `<tr>
            <td>${r[1] || ''}</td>
            <td>${r[2] || ''}</td>
            <td>${r[3] || ''}</td>
            <td>${r[4] || ''}</td>
            <td>${r[6] || ''}</td>
          </tr>`;
        } else {
          return `<tr>
            <td>${r[1] || ''}</td>
            <td>${r[2] || ''}</td>
            <td>${r[3] || ''}</td>
            <td>${r[4] || ''}</td>
            <td>${r[5] || ''}</td>
          </tr>`;
        }
      }).join('');
    } catch (e) {
      tbody.innerHTML = '<tr><td class="vacio" colspan="5">No se pudo leer la hoja. Revisa la implementación.</td></tr>';
    }
  }

  function cambiarTab(tipo, btn) {
    hojaActual = tipo;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('activo'));
    document.querySelectorAll('.formulario').forEach(f => f.classList.remove('activo'));
    btn.classList.add('activo');
    document.getElementById('form' + tipo).classList.add('activo');
    estado.className = '';
    estado.textContent = '';
    cargarUltimos(hojaActual);
  }

  async function enviarDatos(e, form) {
    e.preventDefault();
    const btn = form.querySelector('button[type="submit"]');
    const textoOriginal = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Guardando...';
    estado.className = '';
    estado.textContent = 'Enviando a PLANILLA AFE...';

    try {
      await fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        body: new FormData(form)
      });
      estado.className = 'ok';
      estado.textContent = '¡Registro guardado en PLANILLA AFE!';
      form.reset();
      rellenarFechas();
      setTimeout(() => cargarUltimos(hojaActual), 800);
    } catch (error) {
      estado.className = 'err';
      estado.textContent = 'Error al enviar. Revisa la URL de Apps Script.';
    } finally {
      btn.disabled = false;
      btn.textContent = textoOriginal;
    }
  }

  rellenarFechas();
  cargarUltimos(hojaActual);
</script>

</body>
</html>
